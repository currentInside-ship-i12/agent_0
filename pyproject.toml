[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-0"
version = "0.2.0"
description = "Agent 0 — Tata Steel distributor discovery and evidence verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent 0" }]
dependencies = [
  "typer>=0.20.0",
  "pydantic>=2.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "anthropic>=0.40",
  "openai>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
agent-0 = "agent_0.cli:app"
agent0 = "agent_0.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # typer.Option(...) in defaults is the documented Typer pattern
  "UP006",   # keep typing.List / typing.Dict for py3.10 readability
  "UP035",
  "UP037",
  "UP045",
  "SIM108",  # nested ternaries hurt readability here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # stub signatures mirror the real callables

[tool.ruff.lint.isort]
known-first-party = ["agent_0"]
